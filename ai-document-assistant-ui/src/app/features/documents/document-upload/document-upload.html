<section class="upload-section">
  <h2>Upload Document</h2>

  <input
    type="file"
    accept=".pdf,application/pdf"
    (change)="onFileSelected($event)"
  />

  @if (selectedFile) {
    <p>Selected: {{ selectedFile.name }}</p>
  }

  <button
    type="button"
    (click)="upload()"
    [disabled]="isUploading"
  >
    {{ isUploading ? 'Uploading...' : 'Upload PDF' }}
  </button>

  @if (message) {
    <p>{{ message }}</p>
  }
</section>
